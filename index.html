<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #6e7dff, #ab8fff);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            transition: transform 0.3s ease-in-out;
        }

        .login-container h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 1.5rem;
        }

        .login-container input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .login-container input:focus {
            border-color: #6e7dff;
            outline: none;
        }

        .login-container button {
            width: 100%;
            padding: 15px;
            background-color: #6e7dff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .login-container button:hover {
            background-color: #5a6cdc;
        }

        .login-container .error {
            color: red;
            margin-top: 15px;
            display: none;
            font-size: 0.9rem;
        }

        .login-container p {
            font-size: 0.9rem;
            color: #555;
        }

        .login-container p a {
            color: #6e7dff;
            text-decoration: none;
        }

        .login-container p a:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button onclick="handleLogin()">Login</button>
        <p class="error" id="error">Invalid username or password</p>
    </div>

    <script>
        // Dummy user data
        const users = [
            { username: "admin", password: "voltengin" },
            { username: "merx", password: "admin123" },
            { username: "user", password: "user123" }
        ];

        function handleLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorElement = document.getElementById('error');

            // Check if user exists in dummy data
            const user = users.find(u => u.username === username && u.password === password);

            if (user) {
                // Set authentication flag in sessionStorage
                sessionStorage.setItem('isAuthenticated', 'true');
                // Navigate to home.html
                window.location.href = 'home.html';
            } else {
                // Show error message
                errorElement.style.display = 'block';
            }
        }

        // Clear error message when user starts typing
        document.getElementById('username').addEventListener('input', () => {
            document.getElementById('error').style.display = 'none';
        });
        document.getElementById('password').addEventListener('input', () => {
            document.getElementById('error').style.display = 'none';
        });
    </script>
</body>
</html>
